  mlb:
    label: MLB
    default_discovery: true
    sportsgameodds_league_id: MLB
    odds_api_sport_key: baseball_mlb
    espn_path: baseball/mlb
    kalshi_keywords:
      - runs scored
      - wins by over
      - Philadelphia
      - Atlanta
