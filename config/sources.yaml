agent_contracts:
  source_check:
    phase: source-check
    output: data/<GAME_ID>.source_check.json
    purpose: Verify configured source credentials and optional health probes without exposing secrets.
  slate_discovery:
    phase: slate-discovery
    output: data/<GAME_ID>.slate_candidates.json
    purpose: Select candidate events and mapped Kalshi markets across sports.
  research_agent:
    phase: research-agent
    output: data/<GAME_ID>.research_bundle.json
    purpose: Produce evidence-backed candidate theses with source confidence and disagreement notes.
  slate_verify:
    phase: slate-verify
    output: data/<GAME_ID>.slate_verification.json
    purpose: Verify slate-discovery identity/source coverage before research and execution eligibility.
