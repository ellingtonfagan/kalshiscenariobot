    default_discovery: true
    odds_api_sport_key: soccer_fifa_world_cup
    espn_path: soccer/fifa.world
    kalshi_keywords:
      - Reg Time
      - advances
      - goals scored
      - corners
      - Spain
      - Portugal
      - USA
      - Argentina
      - Belgium
      - France
      - England
      - Colombia
