[project]
name = "kalshi-sports-orderbook"
version = "1.0.0"
description = "Kalshi sports order book and scenario engine with NBA compatibility adapters."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cryptography>=42",
    "PyYAML>=6",
    "anthropic>=0.57",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nbabot = "nbabot.cli:main"
ksobot = "nbabot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
